name: Website · GitHub Pages

on:
  push:
    branches: [website]
    paths: ['website/**', '.github/workflows/website-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r website/requirements.txt
      - name: Check generated Chinese page
        run: |
          python website/tools/build-zh.py
          git diff --exit-code -- website/zh/index.html
      - name: Validate JavaScript syntax
        run: |
          node --check website/js/main.js
          node --input-type=module --check < website/js/scene.js
          node --input-type=module --check < website/js/field.js
      - name: Stage public files only
        run: python website/tools/build-pages.py --output "$RUNNER_TEMP/fmg-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/fmg-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
