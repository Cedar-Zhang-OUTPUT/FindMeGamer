name: fmg-agent-tests
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:55440:6379"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fmg_agent_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: find_me_gamer_agent_test
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmg_agent_test -d find_me_gamer_agent_test"]
      interval: 2s
      timeout: 3s
      retries: 20
