services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: find_me_gamer_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d find_me_gamer_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  test:
    image: backend-test:latest
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - ../docs/creator-import:/contract-docs:ro
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres-test:5432/find_me_gamer_test
      REDIS_URL: redis://redis-test:6379/0
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
