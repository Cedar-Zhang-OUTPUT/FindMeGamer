[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "find-me-gamer-api"
version = "0.1.0"
description = "Find Me Gamer backend service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "bleach>=6.2",
    "boto3>=1.35",
    "celery[redis]>=5.4",
    "cryptography>=44.0",
    "email-validator>=2.2",
    "fastapi>=0.115,<0.116",
    "httpx>=0.28,<0.29",
    "markdown-it-py>=3.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
